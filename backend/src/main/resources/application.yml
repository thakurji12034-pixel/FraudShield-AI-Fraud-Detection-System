server:
  port: 8080

spring:
  application:
    name: fraudshield-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fraudshield_db;DB_CLOSE_DELAY=-1;MODE=MySQL;AUTO_SERVER=TRUE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

fraudshield:
  ml-service:
    url: ${ML_SERVICE_URL:http://127.0.0.1:8000}
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000
  dataset:
    path: ${DATASET_PATH:d:/Fraud - Detection - System/PS_20174392719_1491204439457_log.csv}
    profile-path: ${PROFILE_PATH:d:/Fraud - Detection - System/dataset_profile.json}
